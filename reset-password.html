<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password</title>
<style>
  body { font: 16px/1.6 system-ui, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px 16px 64px; color: #111; background: #fff; }
  h1 { font-size: 28px; }
  input, button { font: inherit; width: 100%; box-sizing: border-box; padding: 12px; margin: 6px 0; border-radius: 8px; border: 1px solid #888; }
  button { background: #D8A62A; color: #000; border: 0; font-weight: 600; }
  button:disabled { opacity: .5; }
  #msg { margin-top: 12px; }
  @media (prefers-color-scheme: dark) { body { color: #eee; background: #000; } input { background: #111; color: #eee; } }
</style>
</head>
<body>
<h1>Set a new Pitwall password</h1>
<form id="form" hidden>
  <label for="pw">New password (at least 8 characters)</label>
  <input id="pw" type="password" autocomplete="new-password" minlength="8" required>
  <label for="pw2">Type it again</label>
  <input id="pw2" type="password" autocomplete="new-password" minlength="8" required>
  <button id="save" type="submit">Save password</button>
</form>
<p id="msg"></p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  // The reset link puts a short-lived login in the address. It is read once,
  // then removed from the address bar. The key below is the public
  // (publishable) key the app itself ships with; access is enforced by the
  // database's row level security.
  var msg = document.getElementById('msg');
  var form = document.getElementById('form');
  var params = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, '', location.pathname);
  var client = supabase.createClient('https://oauwpfychpbwabkfvtzr.supabase.co', 'sb_publishable_lIkiM3EDY2dBYwxLecuFnQ_0FgR1Ots', {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
  });
  if (params.get('type') !== 'recovery' || !params.get('access_token')) {
    msg.textContent = params.get('error_description') || 'This link has expired or was already used. In the app, tap "Forgot password?" to get a new one.';
  } else {
    client.auth.setSession({ access_token: params.get('access_token'), refresh_token: params.get('refresh_token') }).then(function (r) {
      if (r.error) { msg.textContent = 'This link has expired. In the app, tap "Forgot password?" to get a new one.'; return; }
      form.hidden = false;
    });
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = document.getElementById('pw').value;
    if (pw !== document.getElementById('pw2').value) { msg.textContent = 'The passwords don’t match.'; return; }
    if (pw.length < 8) { msg.textContent = 'Use at least 8 characters.'; return; }
    document.getElementById('save').disabled = true;
    client.auth.updateUser({ password: pw }).then(function (r) {
      if (r.error) { msg.textContent = r.error.message; document.getElementById('save').disabled = false; return; }
      form.hidden = true;
      msg.textContent = 'Password saved. Go back to the app and sign in with your new password.';
      client.auth.signOut({ scope: 'local' });
    });
  });
</script>
</body>
</html>
